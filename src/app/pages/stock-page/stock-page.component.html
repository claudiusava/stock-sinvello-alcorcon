<main class="stock-page">
  <section class="stock-page__list" aria-label="Inventario">
    @if (products$ | async; as products) {
      @if (todayMovements$ | async; as todayMovements) {
        @for (product of products; track product.id) {
          <app-stock-product-row
            [product]="product"
            [todayMovement]="todayMovements[product.id]"
            (increase)="increase($event)"
            (decrease)="decrease($event)"
          />
        }
      }
    }
  </section>

  @if (adminOpen()) {
    <app-admin-modal
      (close)="closeAdmin()"
    />
  }
</main>
