<main class="stock-page">
  <section class="stock-page__list" aria-label="Inventario">
    @if (viewModel$ | async; as vm) {
      @for (product of vm.products; track product.id) {
        <app-stock-product-row
          [product]="product"
          [todayMovement]="vm.todayMovements[product.id]"
          (increase)="increase($event)"
          (decrease)="decrease($event)"
        />
      }
    } @else {
      <div class="stock-page__loading" role="status" aria-live="polite">
        <span class="stock-page__spinner" aria-hidden="true"></span>

        @if (loadingTimedOut()) {
          <p class="stock-page__loading-message">
            No se pudo cargar la lista de productos. Reintentando…
          </p>
        }
      </div>
    }
  </section>

  @if (adminOpen()) {
    <app-admin-modal
      (close)="closeAdmin()"
      (feedback)="showToast($event)"
    />
  }

  @if (toastMessage(); as toast) {
    <div
      class="stock-page__toast"
      [class.stock-page__toast--error]="toast.type === 'error'"
      role="status"
    >
      <span class="stock-page__toast-icon">{{ toast.type === "error" ? "❌" : "✅" }}</span>
      {{ toast.text }}
    </div>
  }
</main>
