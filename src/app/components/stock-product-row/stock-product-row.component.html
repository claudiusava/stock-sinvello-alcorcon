<article class="stock-row">
  <button
    class="stock-row__button stock-row__button--minus"
    type="button"
    [disabled]="product.stock <= 0"
    [attr.aria-label]="'Restar stock de ' + product.nombre"
    (click)="decrease.emit(product.id)"
  >
    -
  </button>

  <div class="stock-row__product">
    <span class="stock-row__emoji">
      <img
        class="product-icon"
        [src]="'icons/' + product.id + '.png'"
        [alt]="product.nombre"
      />
    </span>
    <h2 class="stock-row__name">{{ product.nombre }}</h2>
  </div>

  <div class="stock-row__right">
    <button
      class="stock-row__button stock-row__button--plus"
      type="button"
      [attr.aria-label]="'Sumar stock de ' + product.nombre"
      (click)="increase.emit(product.id)"
    >
      +
    </button>

    <div class="stock-row__stock" aria-live="polite">
      <strong>{{ product.stock }}</strong>
      <span>{{ product.unidad }}</span>
    </div>
  </div>
</article>
