<h2 class="manage-products__title">Gestión de productos</h2>

<div class="manage-products__list">
  @for (product of products$ | async; track product.id) {
    <div class="manage-products__row">
      <div class="manage-products__info">
        <span class="manage-products__name">
          {{ product.nombre }}
        </span>
      </div>

      <div class="manage-products__actions">
        <button
          class="icon-button icon-button--edit"
          type="button"
          [attr.aria-label]="'Editar ' + product.nombre"
          (click)="edit(product)"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
          </svg>
        </button>

        <app-toggle
          [checked]="product.activo"
          (changed)="toggleProduct(product.id, product.activo)"
        ></app-toggle>
      </div>
    </div>
  }
</div>

<footer class="manage-products__footer">
  <button
    class="button button--secondary button--small"
    type="button"
    (click)="back.emit()"
  >
    Volver
  </button>
</footer>

@if (confirmingDelete(); as product) {
  <div class="confirm-delete">
    <div class="confirm-delete__box">
      <p class="confirm-delete__text">
        ¿Seguro que quieres eliminar <strong>{{ product.nombre }}</strong>?
        Esta acción no se puede deshacer.
      </p>

      <div class="confirm-delete__actions">
        <button
          class="button button--secondary"
          type="button"
          (click)="cancelDelete()"
        >
          Cancelar
        </button>

        <button
          class="button button--danger"
          type="button"
          [disabled]="deleteCountdown() > 0"
          (click)="confirmDelete()"
        >
          {{ deleteCountdown() > 0 ? "Eliminar (" + deleteCountdown() + ")" : "Eliminar definitivamente" }}
        </button>
      </div>
    </div>
  </div>
}
