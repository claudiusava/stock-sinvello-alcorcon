<h2 class="manage-products__title">
  Gestión de productos
</h2>

<div class="manage-products__list">

  @for (product of products$ | async; track product.id) {

    <div class="manage-products__row">

      <div class="manage-products__info">

        <span class="manage-products__status">
          {{ product.activo ? '🟢' : '🔴' }}
        </span>

        <span class="manage-products__name">
          {{ product.nombre }}
        </span>

      </div>

      <button
        class="button"
        type="button"
        (click)="toggleProduct(product.id, product.activo)">

        {{ product.activo ? 'Desactivar' : 'Activar' }}

      </button>

    </div>

  }

</div>

<footer class="manage-products__footer">

  <button
    class="button button--secondary"
    type="button"
    (click)="back.emit()">

    Volver

  </button>

</footer>
