<div class="backdrop">
  <div class="modal">
    @switch (view()) {
      @case ("menu") {
        <app-admin-menu
          (createProduct)="openCreateProduct()"
          (manageProducts)="openManageProducts()"
          (close)="close.emit()"
        />
      }

      @case ("product-form") {
        <app-product-form (cancel)="backToMenu()" (saved)="close.emit()" />
      }

      @case ("manage-products") {
        <app-manage-products (back)="backToMenu()" />
      }
    }
  </div>
</div>
