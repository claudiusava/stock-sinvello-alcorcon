<div class="backdrop">
  <div class="modal">
    @switch (view()) {
      @case ("menu") {
        <app-admin-menu
          (createProduct)="openCreateProduct()"
          (manageProducts)="openManageProducts()"
          (close)="close.emit()"
        />
      }

      @case ("product-form") {
        <app-product-form
          [product]="selectedProduct()"
          (cancel)="backToMenu()"
          (saved)="close.emit()"
        />
      }

      @case ("manage-products") {
        <app-manage-products
          (back)="backToMenu()"
          (editProduct)="openEditProduct($event)"
        />
      }
    }
  </div>
</div>
